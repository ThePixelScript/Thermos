# ==============================================================================
# THERMOS Production Infrastructure Blueprint (Render.com)
# ==============================================================================
services:
  - type: web
    name: thermos-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: WEATHERAPI_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"\n